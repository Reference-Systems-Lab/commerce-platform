name: Scan

# Weekly, so a new advisory shows up even when nothing changes. Separate from CI because the local
# stand-ins always carry findings we can't fix, which must not block a pull request. See scripts/scan.sh.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Images
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Install Docker Scout from its pinned image, to read the VEX statements
        run: |
          image=$(docker compose -f compose.tools.yaml config --images scout-cli)
          container=$(docker create "$image")
          mkdir -p "$HOME/.docker/cli-plugins"
          docker cp "$container:/docker-scout" "$HOME/.docker/cli-plugins/docker-scout"
          docker rm "$container"

      - name: Scan every pinned image with Grype
        env:
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DHI_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DHI_TOKEN }}
        run: make scan
