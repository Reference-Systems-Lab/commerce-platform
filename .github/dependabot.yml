version: 2

# Every ecosystem waits 7 days after a release before proposing it, and groups its routine updates
# into one pull request. Images are pinned by tag and digest; Dependabot updates both.
registries:
  # Docker Hardened Images: a read-only Docker Hub token, in the repository's Dependabot secrets.
  dhi:
    type: docker-registry
    url: https://dhi.io
    username: ${{ secrets.DHI_USERNAME }}
    password: ${{ secrets.DHI_TOKEN }}

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # compose.yaml (the platform), compose.tools.yaml (the lint tools) and compose/ (the applications'
  # wiring). Bumping an application's image also needs its include bumped to the same release in
  # compose.yaml: make lint fails until it is (README, "Updating an application").
  - package-ecosystem: docker-compose
    directories: ["/", "/compose"]
    registries: [dhi]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Stay on nginx's stable line (1.30); a new stable line is a deliberate change.
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # A new PostgreSQL major version needs a data migration, so it is never automatic.
      - dependency-name: dhi.io/postgres
        update-types: ["version-update:semver-major"]

  # The derived images' pinned bases (images/mailpit, images/meilisearch).
  - package-ecosystem: docker
    directories: ["/images/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
        update-types: [minor, patch]
