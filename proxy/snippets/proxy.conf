# Included by every location that proxies to a service. Written once because proxy_set_header is
# inherited all or nothing.

proxy_http_version 1.1;

# The original Host: services check it (Mailpit rejects any other Host or Origin).
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
# This proxy is the first hop, so the client's address replaces anything the client sent: a service
# reading the left-most X-Forwarded-For entry can't be fooled. Forwarded is dropped for the same reason.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";

# WebSocket upgrades (maps in conf.d/00-http.conf). A location that holds WebSockets open raises
# proxy_read_timeout itself; everything else keeps nginx's 60 s, so a hung request ends in a 504.
proxy_set_header Upgrade $websocket_upgrade;
proxy_set_header Connection $connection_upgrade;

# A proxy_pass with a variable turns off nginx's default redirect rewriting; keep redirects on HTTPS.
proxy_redirect http:// https://;
