# Included by every location that proxies to a service. Written once because proxy_set_header is
# inherited all or nothing.

proxy_http_version 1.1;

# The original Host: services check it (Mailpit rejects any other Host or Origin).
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# WebSocket upgrades (map in conf.d/00-http.conf).
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 1h;

# A proxy_pass with a variable turns off nginx's default redirect rewriting; keep redirects on HTTPS.
proxy_redirect http:// https://;
