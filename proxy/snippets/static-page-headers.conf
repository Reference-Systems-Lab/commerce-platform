# Headers for the pages the proxy serves itself (the placeholder and the 503 page). Applications set
# their own; these pages have no scripts, only a same-origin stylesheet.
add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cache-Control "no-cache" always;
