# api.rsl-commerce.test: the backend (commerce-backend's compose.platform.yaml, wired in
# compose/compose.backend.yaml). The backend sets its own response headers; the proxy adds only HSTS.
server {
  listen 443 ssl;
  http2 on;
  server_name api.rsl-commerce.test;

  include /etc/nginx/snippets/hsts.conf;

  location / {
    set $backend http://backend-api:8080; # a variable, so the proxy starts even when the backend isn't up
    proxy_pass $backend;
    include /etc/nginx/snippets/proxy.conf;
  }

  # When the backend isn't running, show the same page as the addresses that aren't part of the stack yet.
  error_page 502 504 =503 /503.html;

  location = /503.html {
    internal;
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/static-page-headers.conf;
  }

  # The 503 page's stylesheet, so it renders when the backend is down. The backend has no /site.css.
  location = /site.css {
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/static-page-headers.conf;
  }
}
