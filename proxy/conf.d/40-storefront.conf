# rsl-commerce.test: a static placeholder until the storefront joins the stack.
server {
  listen 443 ssl;
  http2 on;
  server_name rsl-commerce.test;

  include /etc/nginx/snippets/hsts.conf;
  include /etc/nginx/snippets/static-page-headers.conf;

  root /usr/share/nginx/html;

  location = / {
    try_files /index.html =404;
  }

  location = /site.css {
  }

  location / {
    return 404;
  }
}
