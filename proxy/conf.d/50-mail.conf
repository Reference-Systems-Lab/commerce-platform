# mail.rsl-commerce.test: Mailpit's web UI and API.
server {
  listen 443 ssl;
  http2 on;
  server_name mail.rsl-commerce.test;

  include /etc/nginx/snippets/hsts.conf;

  location / {
    set $mailpit http://mailpit:8025; # a variable, so the proxy starts even when Mailpit isn't up
    proxy_pass $mailpit;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Mailpit's live updates: a WebSocket that stays open while the UI is.
  location = /api/events {
    set $mailpit http://mailpit:8025;
    proxy_pass $mailpit;
    include /etc/nginx/snippets/proxy.conf;
    proxy_read_timeout 1h;
  }

  # The 503 page's stylesheet, so it renders when Mailpit is down (Mailpit has no /site.css).
  location = /site.css {
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/static-page-headers.conf;
  }

  # When Mailpit isn't running, show the same page as the addresses that aren't part of the stack yet.
  error_page 502 504 =503 /503.html;

  location = /503.html {
    internal;
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/static-page-headers.conf;
  }
}
