# Plain HTTP to a known address goes to HTTPS, keeping the path and query.
server {
  listen 80;
  server_name rsl-commerce.test api.rsl-commerce.test admin.rsl-commerce.test checkout.rsl-commerce.test
              docs.rsl-commerce.test design.rsl-commerce.test mail.rsl-commerce.test observe.rsl-commerce.test;
  return 301 https://$host$request_uri;
}
