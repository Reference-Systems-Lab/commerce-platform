# Addresses whose applications aren't part of the local stack yet answer 503 with an explanation.
# Each moves to its own file when its application joins the stack.
server {
  listen 443 ssl;
  http2 on;
  server_name admin.rsl-commerce.test checkout.rsl-commerce.test docs.rsl-commerce.test
              design.rsl-commerce.test observe.rsl-commerce.test;

  include /etc/nginx/snippets/hsts.conf;
  include /etc/nginx/snippets/static-page-headers.conf;

  root /usr/share/nginx/html;
  error_page 503 /503.html;

  location = /503.html {
    internal;
  }

  location = /site.css {
  }

  location / {
    return 503;
  }
}
