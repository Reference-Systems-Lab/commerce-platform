# Settings shared by every server. The image's nginx.conf includes this directory inside its http block.

server_tokens off;

# A location's own add_header adds to its server's headers instead of replacing them (nginx 1.29.3+).
add_header_inherit merge;

ssl_certificate /etc/nginx/certs/cert.pem; # issued by scripts/ca.sh for the 8 local hosts
ssl_certificate_key /etc/nginx/certs/key.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:1m;
ssl_session_timeout 1h;

# Docker's embedded DNS. A proxy_pass that uses a variable resolves its service per request, so the
# proxy starts even when that service isn't running and answers 502 instead of failing.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrades: pass Upgrade through, and close the connection otherwise.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}
