# The local commerce platform: a TLS proxy and the infrastructure the applications declare they need.
# Run it with `make bootstrap` once, then `make up` (see the README). Development only: these containers
# stand in for managed services and are not production infrastructure.
#
# Every container is hardened the same way (DE-5): a numeric non-root user, a read-only root filesystem,
# no Linux capabilities, no privilege escalation and an init process. Every image is pinned by digest;
# Dependabot keeps the pins current (.github/dependabot.yml).
#
# Networks: edge, where the proxy reaches the web UIs and the applications, and data, where the
# applications reach the infrastructure. Both are internal (no route out), so no application or service
# can reach the internet, and the proxy can't reach any data service. Only the proxy is also on ingress,
# the one ordinary network, because publishing ports needs one (RabbitMQ's UI has rabbitmq-ui for the
# same reason). ADR 0002.
name: rsl-commerce

# The applications. Each declares its own services in its repository's compose.platform.yaml, fetched
# here at the commit of a release (a tag can move; a commit can't), with the release named in a comment.
# This repository's wiring file (compose/compose.<app>.yaml) pins the image by digest and sets the
# networks and the start order, and a committed env file gives the fragment its non-secret settings
# (ADR 0002). Bump the commit, its comment and the wiring's image together; make lint checks they agree.
include:
  - path:
      - https://github.com/Reference-Systems-Lab/commerce-backend.git#929b6f17e44e6eb5cc60b1e5faf2f23a46bbc921:compose.platform.yaml # v0.1.0
      - compose/compose.backend.yaml
    env_file: compose/backend.env

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  tmpfs: ["/tmp:size=64m"] # sized, so a runaway writer fills its own tmpfs rather than the machine's memory

services:
  # Terminates TLS for the 8 local addresses and routes each to its service (proxy/conf.d).
  proxy:
    <<: *hardened
    image: nginxinc/nginx-unprivileged:1.30.5-alpine-slim@sha256:3af0c10d960cc2502427fe1219c52989d309e7d65596869c60a34fd2fa2406f0
    user: "101:101"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    networks: [edge, ingress] # ingress only to publish 80 and 443
    volumes:
      # create_host_path: false, so a missing directory is an error instead of a root-owned empty one.
      - { type: bind, source: ./proxy/conf.d, target: /etc/nginx/conf.d, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./proxy/snippets, target: /etc/nginx/snippets, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./proxy/html, target: /usr/share/nginx/html, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./certs/leaf, target: /etc/nginx/certs, read_only: true, bind: { create_host_path: false } }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

  postgres:
    <<: *hardened
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    user: "999:999"
    environment:
      POSTGRES_USER: commerce
      POSTGRES_DB: commerce
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    networks: [data]
    volumes:
      - postgres:/var/lib/postgresql
    tmpfs: ["/tmp:size=64m", "/var/run/postgresql:uid=999,gid=999,size=1m"]
    healthcheck:
      # Over TCP: the server the image starts for its first-run setup listens only on the socket, so this
      # stays unhealthy until the real server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "commerce", "-d", "commerce"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 1s

  # Redis-compatible cache, rate limits and locks (DE-12). Requires the generated password (D-13), read
  # from a secret file so it never appears on a command line.
  valkey:
    <<: *hardened
    image: valkey/valkey:9.1.2-trixie@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    user: "999:999"
    command: ["valkey-server", "/run/secrets/valkey_config"]
    environment:
      TINI_SUBREAPER: "1" # the image's own tini runs under Docker's init; this lets it reap as intended
    secrets: [valkey_config]
    networks: [data]
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$$(sed -n 's/^requirepass //p' /run/secrets/valkey_config)\" valkey-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  rabbitmq:
    <<: *hardened
    image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
    user: "999:999"
    hostname: rabbitmq # RabbitMQ keys its data directory by node name, so it must not change
    environment:
      # Applied only when the data volume is first created; `make reset` starts over.
      RABBITMQ_DEFAULT_USER: commerce
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run make bootstrap first}
      ERL_CRASH_DUMP: /var/lib/rabbitmq/erl_crash.dump # the root filesystem is read-only; keep a crash dump
    ports:
      - "127.0.0.1:15672:15672" # management UI, for developers only
    # rabbitmq-ui exists only so the management port can be published: an internal network can't.
    networks: [data, rabbitmq-ui]
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      - { type: bind, source: ./config/rabbitmq/20-commerce.conf, target: /etc/rabbitmq/conf.d/20-commerce.conf, read_only: true, bind: { create_host_path: false } }
    healthcheck:
      # Healthy once AMQP (5672) and the management API accept connections, not merely once the node
      # answers: services that wait for rabbitmq to be healthy connect straight away.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # Catches every email the platform sends; the UI is at https://mail.rsl-commerce.test.
  mailpit:
    <<: *hardened
    build: ./images/mailpit
    pull_policy: build # built here from a pinned base, never pulled by name
    user: "65534:65534"
    environment:
      MP_DATABASE: /data/mailpit.db
      # Mailpit refuses other Host headers (DNS-rebinding protection). The proxy forwards the original Host.
      MP_ALLOWED_HOSTS: mail.rsl-commerce.test,mailpit
    networks: [edge, data] # the UI for the proxy; SMTP for the applications
    volumes:
      - mailpit:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  meilisearch:
    <<: *hardened
    build: ./images/meilisearch
    pull_policy: build # built here from a pinned base, never pulled by name
    user: "65534:65534"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?run make bootstrap first}
      MEILI_NO_ANALYTICS: "true"
      TINI_SUBREAPER: "1" # as for valkey
    tmpfs: ["/tmp:size=512m"] # indexing writes its sort files here
    networks: [data]
    volumes:
      - meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

secrets:
  postgres_password:
    # File-sourced: Compose refuses secrets from the environment in a read-only service. Written by
    # scripts/gen-env.sh from .env.
    file: ./secrets/postgres_password
  valkey_config:
    # A one-line Valkey config, "requirepass <VALKEY_PASSWORD>", written by scripts/gen-env.sh.
    file: ./secrets/valkey.conf

networks:
  ingress: {}
  edge:
    internal: true
  data:
    internal: true
  rabbitmq-ui: {}

volumes:
  postgres: {}
  valkey: {}
  rabbitmq: {}
  mailpit: {}
  meilisearch: {}
